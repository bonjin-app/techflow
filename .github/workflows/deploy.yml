name: Build & deploy (static)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The workflow token cannot create the Pages site itself (the API answers
# "Resource not accessible by integration"), so the deploy job fails until that is set.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate content, lint, typecheck
        run: |
          pnpm validate
          pnpm lint
          pnpm exec next typegen && pnpm typecheck
      - name: Build static site
        env:
          # GitHub Pages serves project sites under /<repo>. Remove both lines for a custom domain.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm build
      - name: Check every internal link resolves
        run: pnpm check:links
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
