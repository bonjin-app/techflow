# Pull requests get the same gates as main, minus the deploy — and the same
# build configuration, so what a contributor sees is what ships. Keeping them in
# a separate file means a change to the release process cannot quietly weaken
# the checks a contributor sees.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The same two the deploy sets. A pull request that builds for the root
      # while main builds for /<repo> cannot see a base-path bug, and did not:
      # every route-driven end-to-end test 404'd under the deploy's own build
      # for as long as the suite has existed, and CI was green throughout.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Content, questions and paths
        run: pnpm validate
      - run: pnpm lint
      - run: pnpm exec next typegen && pnpm typecheck
      - name: Unit tests
        run: pnpm gen && pnpm test
      - name: Build
        run: pnpm build
      - name: Links, sitemap and the published API
        run: pnpm check:links
      - name: Accessibility and page budgets
        run: pnpm check:build
      - name: Install the browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against the built export
        run: pnpm e2e
